# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user a single clarifying question when blocked by ambiguity, missing information, or a decision is required before continuing. Rules: 1) Use response_type='text' when information/content needed for sending is still missing. 2) Use response_type='yes_no' ONLY when you already have specific final content and need the user to confirm that exact content - the question MUST include that final content for confirmation. Never use 'yes_no' for open-ended questions. 3) Use 'choice' for selecting from options. Do NOT use for routine implementation details that can be reasonably inferred."
    parameters:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          description: "Clear, specific question to ask the user, in Vietnamese. Ask only ONE question per call. If response_type is 'yes_no', MUST include the specific final content to be confirmed."
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: "'text' = missing info/content, need open input. 'yes_no' = final content already exists, need confirmation of that content ONLY. 'choice' = need selection from options."
        options:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 2
          maxItems: 4
          uniqueItems: true
          description: "REQUIRED only when response_type is 'choice'. List of 2-4 distinct, non-overlapping choices. Omit otherwise."
      required: [question, response_type]
      additionalProperties: false

  - name: timeline
    description: "Get recent posts from a specific user's timeline. Use when the user asks for latest posts/tweets from an account. Input is a single username, not a search query or hashtag."
    parameters:
      type: object
      properties:
        screenname:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9_]{1,15}$"
          description: "Account username without leading '@', e.g. 'elonmusk'. Required."
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
          description: "Number of recent posts to retrieve. Default is 5."
      required: [screenname]
      additionalProperties: false

  - name: social_search
    description: "Search for posts on social media by keyword, hashtag, or topic. Use for general discovery across accounts, not for fetching a specific user's timeline. Use 'Latest' for newest posts, 'Top' for most popular/engaging posts."
    parameters:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: "Search keyword, hashtag, or topic, e.g. 'AI agent'. Must be a specific search term, not a username. Required."
        search_type:
          type: string
          enum: [Latest, Top]
          default: "Latest"
          description: "Sort order. 'Latest' = newest first, 'Top' = most popular first. Default is 'Latest'."
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
          description: "Number of posts to return. Default is 5."
      required: [query]
      additionalProperties: false

  - name: lookup
    description: >
      Search the web for general information or recent news.
      Use topic=news for news requests.
      Use timeframe=day for today,
      week for this week,
      month for this month,
      and year for this year.
      Do not use this tool to read a specific URL.
      Use fetch when a URL is provided.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Search keywords.
        topic:
          type: string
          enum: [general, news]
          default: general
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: week
        max_results:
          type: integer
          default: 5
      required: [query]

  - name: fetch
    description: "Fetch and extract readable content from a single public URL. Use when you have a direct post/article URL from timeline or social_search and need its full text. Input must be a complete http/https URL, not a username or search keyword."
    parameters:
      type: object
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          pattern: "^https?://[^\\s]+$"
          description: "Full public URL to fetch, e.g. 'https://x.com/user/status/123'. Must start with http:// or https://. Required."
      required: [url]
      additionalProperties: false

  - name: format
    description: "Render already-collected items into final user-facing text. Does NOT search or fetch, only formats. Call once at the end after timeline/social_search/fetch. Input must be 1+ real items from previous tool results, never invent items."
    parameters:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: "List of real items to render. Must contain at least 1 item. Required."
          items:
            type: object
            properties:
              title:
                type: string
                minLength: 1
                description: "Item title or post headline."
              url:
                type: string
                format: uri
                description: "Source URL for citation, e.g. 'https://x.com/...'. Omit if unavailable."
              source:
                type: string
                minLength: 1
                description: "Account name or source name, e.g. 'elonmusk'. Omit if unavailable."
              summary:
                type: string
                minLength: 1
                description: "1-3 sentence summary/content of the item."
              section:
                type: string
                minLength: 1
                description: "Group name. REQUIRED when template is 'sections' or 'daily_ai_vn', omit otherwise."
            required: [title, summary]
            additionalProperties: false
        template:
          type: string
          enum: [brief, sections, bullets, thread, daily_ai_vn]
          default: "sections"
          description: "Output layout. 'brief'=short recap, 'sections'=grouped by section, 'bullets'=bullet list, 'thread'=numbered thread style, 'daily_ai_vn'=Vietnamese daily AI newsletter. Default is 'sections'."
        headline:
          type: string
          minLength: 1
          description: "Optional overall title for the output. Omit if not needed."
      required: [items]
      additionalProperties: false
  # ---------------- Bonus tools ----------------
  - name: send
    description: >
      Send a message to the Telegram channel.
      Only execute when the user has explicitly confirmed
      the exact message and confirmed=true.
      Never send without confirmation.
    parameters:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: "Exact final content to send. Must be non-empty and already formatted. Required."
        confirmed:
          type: boolean
          default: false
          description: "Safety gate. 'true' = really send, 'false' = dry-run/preview only, will NOT deliver. Set to 'true' only when ready to send. Default is 'false'."
      required: [text, confirmed]
      additionalProperties: false

  - name: policy
    description: "Search internal policy and guideline documents. Use before external publishing, data handling, citation, or when unsure about allowed behavior. Does NOT search social media, only internal docs."
    parameters:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: "Natural-language policy question or keyword, e.g. 'rules for citing sources when publishing'. Required."
        policy_area:
          type: string
          enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage]
          default: "all"
          description: "Document group to search. 'all'=search everywhere. Use 'source_citation' for citation rules, 'data_privacy' for PII/handling, 'external_publishing' for pre-send checks, 'tool_usage' for tool workflow, 'ai_research' for research scope. Default is 'all'."
        top_k:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: "Number of policy chunks to return. Default is 3."
      required: [query]
      additionalProperties: false

  - name: papers
    description: "Search scientific papers by keyword, title, or arXiv-style query. Use for literature discovery and grounding AI claims. Returns metadata and abstracts, not full PDF text. Does NOT search social media or internal policy docs."
    parameters:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: "Paper search keyword or query, e.g. 'diffusion transformers'. Must be a research topic, not a username or URL. Required."
        max_results:
          type: integer
          minimum: 1
          maximum: 30
          default: 5
          description: "Number of papers to return. Default is 5."
        sort_by:
          type: string
          enum: [relevance, lastUpdatedDate, submittedDate]
          default: "relevance"
          description: "Sort order. 'relevance'=most relevant first, 'lastUpdatedDate'=recently updated first, 'submittedDate'=newest submissions first. Default is 'relevance'."
      required: [query]
      additionalProperties: false

  - name: paper_text
    description: "Fetch full text of a single paper from a 'papers' search result. Use when you have an arXiv ID or URL and need content beyond title/abstract. Call after 'papers', never guess IDs."
    parameters:
      type: object
      properties:
        arxiv_url:
          type: string
          minLength: 4
          description: "arXiv ID e.g. '2401.01234' or full URL e.g. 'https://arxiv.org/abs/2401.01234'. Must come from a 'papers' result. Required."
        max_pages:
          type: integer
          minimum: 1
          maximum: 30
          default: 5
          description: "Max pages to extract from the start. Default is 5."
        max_chars:
          type: integer
          minimum: 1000
          maximum: 50000
          default: 8000
          description: "Max characters to return. Truncated if paper is longer. Default is 8000."
      required: [arxiv_url]
      additionalProperties: false

  - name: calculator
    description: "Perform one basic arithmetic operation locally without calling an external API. Use for numeric calculations that combine two numbers. Supported operations are add, subtract, multiply, and divide. Do not use for expressions with more than two operands, variables, symbolic math, or arbitrary Python code."
    parameters:
      type: object
      properties:
        a:
          type: number
          description: "First numeric operand. Required."
        b:
          type: number
          description: "Second numeric operand. Required."
        operation:
          type: string
          enum: [add, subtract, multiply, divide]
          description: "Operation to apply: 'add' (a + b), 'subtract' (a - b), 'multiply' (a * b), or 'divide' (a / b). Required."
      required: [a, b, operation]
      additionalProperties: false
